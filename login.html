<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - روائع الفانتازيا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff4d94;
            --dark: #2d2d3a;
            --light: #f8f9fa;
            --radius: 12px;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-header p {
            opacity: 0.9;
        }

        .login-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--accent);
            margin-top: 10px;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
            color: #666;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 45%;
            height: 1px;
            background: #ddd;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 45%;
            height: 1px;
            background: #ddd;
        }

        .alert {
            padding: 12px 15px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-home a:hover {
            color: var(--primary);
        }

        .form-switch {
            margin-top: 20px;
            text-align: center;
        }

        .form-switch button {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .form-switch button:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-dragon"></i> روائع الفانتازيا</h1>
            <p>أرحب بعودتك إلى عالم الفانتازيا السحري</p>
        </div>

        <div class="alert alert-success" id="successAlert"></div>
        <div class="alert alert-error" id="errorAlert"></div>

        <form class="login-form" id="loginForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label for="name"><i class="fas fa-user"></i> اسم المستخدم</label>
                <input type="text" id="name" class="form-control" placeholder="أدخل اسمك">
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="password" class="form-control" placeholder="********" required>
            </div>

            <div class="form-group" id="confirmGroup" style="display: none;">
                <label for="confirmPassword"><i class="fas fa-lock"></i> تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="********">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>تسجيل الدخول</span>
            </button>

            <div class="form-switch">
                <button type="button" id="switchForm">
                    إنشاء حساب جديد
                </button>
            </div>
        </form>

        <div class="links">
            <a href="index.html">العودة إلى الرئيسية</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let isLoginMode = true;
        
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const switchForm = document.getElementById('switchForm');
        const nameGroup = document.getElementById('nameGroup');
        const confirmGroup = document.getElementById('confirmGroup');
        const successAlert = document.getElementById('successAlert');
        const errorAlert = document.getElementById('errorAlert');

        function showAlert(element, message, duration = 3000) {
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, duration);
        }

        function showLoading() {
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 2000);
        }

        function switchMode() {
            isLoginMode = !isLoginMode;
            
            if (isLoginMode) {
                nameGroup.style.display = 'none';
                confirmGroup.style.display = 'none';
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                switchForm.textContent = 'إنشاء حساب جديد';
                showAlert(successAlert, 'وضع تسجيل الدخول');
            } else {
                nameGroup.style.display = 'block';
                confirmGroup.style.display = 'block';
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب';
                switchForm.textContent = 'تسجيل الدخول';
                showAlert(successAlert, 'وضع إنشاء حساب جديد');
            }
        }

        async function handleLogin(email, password) {
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showAlert(successAlert, 'تم تسجيل الدخول بنجاح!');
                    
                    // توجيه المستخدم حسب الدور
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1500);
                } else {
                    showAlert(errorAlert, data.error || 'حدث خطأ في تسجيل الدخول');
                }
            } catch (error) {
                showAlert(errorAlert, 'حدث خطأ في الاتصال بالخادم');
            }
        }

        async function handleRegister(name, email, password) {
            if (password !== document.getElementById('confirmPassword').value) {
                showAlert(errorAlert, 'كلمتا المرور غير متطابقتين');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showAlert(successAlert, 'تم إنشاء الحساب بنجاح!');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showAlert(errorAlert, data.error || 'حدث خطأ في إنشاء الحساب');
                }
            } catch (error) {
                showAlert(errorAlert, 'حدث خطأ في الاتصال بالخادم');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            showLoading();
            
            if (isLoginMode) {
                await handleLogin(email, password);
            } else {
                const name = document.getElementById('name').value;
                await handleRegister(name, email, password);
            }
        });

        switchForm.addEventListener('click', switchMode);

        // تحقق من تسجيل الدخول مسبقاً
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (token) {
                window.location.href = 'index.html';
            }
            
            // بيانات الدخول للإدارة (لتسهيل الاختبار)
            document.getElementById('email').value = 'esraaaaa@gmail.com';
            document.getElementById('password').value = 'mhamdzreik1234';
        });
    </script>
</body>
</html>
